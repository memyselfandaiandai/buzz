[package]
name = "buzz-secrets"
version = "0.1.0"
edition = "2021"
description = "Pluggable secret vault provider SPI and ABAC leasing engine for Buzz"

[dependencies]
async-trait = "0.1"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.0", features = ["sync", "time", "process", "rt", "macros", "io-util"] }
tracing = "0.1"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["serde"] }

# Keyring support for Tier 1 native OS credential storage
keyring = { version = "3.6.3", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native", "vendored"], optional = true }
process-wrap = { version = "9.1", default-features = false, features = ["tokio1", "job-object", "kill-on-drop"] }
windows-registry = "0.6"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["process", "signal"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "vendored"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "vendored"], optional = true }

[features]
default = ["os-keyring", "bws"]
os-keyring = ["dep:keyring"]
bws = []
